<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111312">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Food Widget">
  <link rel="manifest" href="widget.manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Food Tracker Widget</title>
  <style>
    :root{color-scheme:dark;--bg:#111312;--panel:#1a1f1c;--panel-2:#222720;--text:#f4f1e8;--muted:#aaa69a;--line:#343a33;--accent:#8fcf8f;--danger:#ff8c7a;--warn:#f4c86a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;display:flex;flex-direction:column;gap:16px;align-items:center}
    .widget{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;width:100%;overflow:hidden}
    .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:0}
    .big{font-size:44px;font-weight:700;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
    .positive{color:var(--accent)} .negative{color:var(--danger)}
    .muted{color:var(--muted)}
    .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
    .bar{height:8px;background:var(--panel-2);border-radius:999px;overflow:hidden;margin-top:6px}
    .fill{height:100%;background:var(--accent);border-radius:999px}
    .fill.warn{background:var(--warn)} .fill.danger{background:var(--danger)}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .stat strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}
    .macro{margin-top:10px}
    .macro .row span:last-child{font-size:12px}
    .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
    /* Size presets, mirroring common home-screen widget proportions */
    .small{width:170px;height:170px;aspect-ratio:1/1}
    .medium{width:360px;height:170px}
    .large{width:360px;min-height:380px}
    .small .widget,.medium .widget{height:100%;display:flex;flex-direction:column}
    .small .widget{justify-content:space-between;padding:14px}
    .preview-title{color:var(--muted);font-size:12px;margin:0 0 -8px;align-self:flex-start;width:100%;max-width:360px}
    .wrap{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
    .state-msg{color:var(--muted)}
    /* Robot eyes: placed per size, sized to fit each card */
    .widget{position:relative}
    .eyes{display:block;width:64px;height:26px;max-width:100%}
    .eyes-slot.corner{position:absolute;right:14px;top:14px}
    .eyes-slot.corner-bottom{position:absolute;right:14px;bottom:14px}
    .medium .eyes-slot{margin-top:10px}
    .medium .eyes{width:72px;height:29px}
    .large .eyes{width:72px;height:29px}
    @media (max-width:420px){.medium,.large{width:100%}}
  </style>
</head>
<body>
  <div id="root" class="wrap"><p class="state-msg">Loading…</p></div>

  <script>
    const SIZE = new URLSearchParams(location.search).get('size');
    const SIZES = SIZE ? [SIZE] : ['small', 'medium', 'large'];
    const REFRESH_MS = 60_000;

    const fmt = (n, digits = 0) => Number.isFinite(Number(n)) ? Number(n).toLocaleString(undefined, { maximumFractionDigits: digits, minimumFractionDigits: digits }) : '-';
    const pctClass = (value, target) => {
      const pct = target > 0 ? (value / target) * 100 : 0;
      return pct > 115 ? 'danger' : pct > 90 ? 'warn' : '';
    };
    const barWidth = (value, target) => target > 0 ? Math.min(140, (value / target) * 100) : 0;

    function remainingBlock(s) {
      const cls = s.remaining_calories >= 0 ? 'positive' : 'negative';
      return `
        <p class="label">Remaining kcal</p>
        <div class="big ${cls}">${fmt(s.remaining_calories)}</div>
        <p class="muted">${fmt(s.totals.calories)} of ${fmt(s.targets.calories)} eaten</p>`;
    }

    function macroBars(s) {
      return [['Protein', 'protein'], ['Carbs', 'carbs'], ['Fat', 'fat']].map(([label, key]) => {
        const value = s.totals[key], target = s.targets[key];
        return `<div class="macro">
          <div class="row"><strong>${label}</strong><span class="muted">${fmt(value, 1)} / ${fmt(target, 1)}g</span></div>
          <div class="bar"><div class="fill ${pctClass(value, target)}" style="width:${barWidth(value, target)}%"></div></div>
        </div>`;
      }).join('');
    }

    function weightStats(w) {
      const trend = w.trend ? `${w.trend} ${w.trend === 'up' ? '↑' : w.trend === 'down' ? '↓' : '→'}` : 'no data';
      return `
        <div class="row"><p class="label">Weight</p><span class="tag">${trend}</span></div>
        <div class="stats">
          <div class="stat"><span class="muted">Current</span><strong>${w.latest ? fmt(w.latest.weight, 1) : '-'}</strong></div>
          <div class="stat"><span class="muted">7-day avg</span><strong>${w.average7 ? fmt(w.average7, 1) : '-'}</strong></div>
        </div>`;
    }

    const RENDERERS = {
      small: (s) => `
        <div class="widget">
          ${remainingBlock(s)}
          <p class="muted" style="margin:0">${s.weight.latest ? fmt(s.weight.latest.weight, 1) + ' kg' : 'No weight yet'}</p>
          <div class="eyes-slot corner-bottom"></div>
        </div>`,

      medium: (s) => `
        <div class="widget">
          <div class="row">
            <div>${remainingBlock(s)}<div class="eyes-slot"></div></div>
            <div style="flex:1;min-width:0">${macroBars(s)}</div>
          </div>
        </div>`,

      large: (s) => `
        <div class="widget">
          ${remainingBlock(s)}
          <div class="eyes-slot corner"></div>
          <div style="margin-top:16px">${macroBars(s)}</div>
          <div style="margin-top:18px">${weightStats(s.weight)}</div>
        </div>`,
    };

    /* Animated eyes, ported from the app header. Mood follows today's intake. */
    class RoboEyes {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        const css = getComputedStyle(document.documentElement);
        this.eyeColor = css.getPropertyValue('--accent').trim() || '#8fcf8f';
        this.bgColor = css.getPropertyValue('--panel').trim() || '#1a1f1c';
        this.reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        this.defaultWidth = 28;
        this.defaultHeight = 28;
        this.defaultRadius = 6;
        this.space = 8;
        this.centerY = canvas.height / 2;
        this.mood = 0;
        this.lastMoodKey = '';
        this.mouse = { x: 0, y: 0, lastMove: 0 };
        this.look = { x: 0, y: 0 };
        this.targetLook = { x: 0, y: 0 };
        this.idle = { nextAt: performance.now() + this.randomRange(4000, 8000) };
        this.blinking = false;
        this.blinkUntil = 0;
        this.nextBlinkAt = performance.now() + this.randomRange(2000, 6000);
        this.confusedUntil = 0;
        this.laughUntil = 0;
        this.lastFrame = 0;
        this.eyes = [-1, 1].map((side) => ({
          side,
          x: canvas.width / 2 + side * ((this.defaultWidth + this.space) / 2),
          y: this.centerY,
          w: this.defaultWidth,
          h: 1,
          r: this.defaultRadius,
          topLid: 0,
          bottomLid: 0,
          pupilX: 0,
          pupilY: 0
        }));

        document.addEventListener('mousemove', (event) => {
          this.mouse.x = event.clientX;
          this.mouse.y = event.clientY;
          this.mouse.lastMove = performance.now();
        }, { passive: true });

        if (!this.reduceMotion) setTimeout(() => this.blink(), 1000);
        requestAnimationFrame((time) => this.frame(time));
      }

      randomRange(min, max) {
        return min + Math.random() * (max - min);
      }

      tween(current, target) {
        return (current + target) / 2;
      }

      blink() {
        this.blinking = true;
        this.blinkUntil = performance.now() + 130;
      }

      confused() {
        this.confusedUntil = performance.now() + 500;
      }

      laugh() {
        this.laughUntil = performance.now() + 500;
      }

      updateFromSummary(summary) {
        if (!summary) return;
        const totals = summary.totals || {};
        const targets = summary.targets || {};
        const stats = summary.insights?.stats || {};
        const calories = Number(totals.calories || 0);
        const calorieTarget = Number(targets.calories || 0);
        const protein = Number(totals.protein || 0);
        const proteinTarget = Number(targets.protein || 0);
        const streak = Number(stats.current_streak || 0);
        let mood = 0;
        let action = '';

        if (calorieTarget <= 0) {
          action = 'confused';
        } else if (proteinTarget > 0 && protein >= proteinTarget) {
          mood = 3;
        } else if (calories > calorieTarget * 1.1) {
          mood = 2;
        } else if (calories > calorieTarget) {
          mood = 1;
        } else if (streak >= 7) {
          action = 'laugh';
        }

        const moodKey = `${mood}:${action}:${Math.floor(calories)}:${Math.floor(protein)}:${streak}`;
        this.mood = mood;
        if (moodKey !== this.lastMoodKey) {
          if (action === 'confused') this.confused();
          if (action === 'laugh') this.laugh();
          this.lastMoodKey = moodKey;
        }
      }

      updateTargets(now) {
        if (this.reduceMotion) {
          this.look.x = 0;
          this.look.y = 0;
          return;
        }
        if (this.blinking && now >= this.blinkUntil) {
          this.blinking = false;
          this.nextBlinkAt = now + this.randomRange(2000, 6000);
        } else if (!this.blinking && now >= this.nextBlinkAt) {
          this.blink();
        }

        const mouseActive = now - this.mouse.lastMove < 5000;
        if (mouseActive) {
          this.targetLook.x = Math.max(-8, Math.min(8, ((this.mouse.x / window.innerWidth) - 0.5) * 16));
          this.targetLook.y = Math.max(-5, Math.min(5, ((this.mouse.y / window.innerHeight) - 0.5) * 10));
        } else if (now >= this.idle.nextAt) {
          this.targetLook.x = this.randomRange(-8, 8);
          this.targetLook.y = this.randomRange(-5, 5);
          this.idle.nextAt = now + this.randomRange(4000, 8000);
        }

        this.look.x = this.tween(this.look.x, this.targetLook.x);
        this.look.y = this.tween(this.look.y, this.targetLook.y);
      }

      drawRoundedRect(x, y, w, h, r, color) {
        this.ctx.fillStyle = color;
        this.ctx.beginPath();
        if (this.ctx.roundRect) {
          this.ctx.roundRect(x, y, w, h, Math.max(1, Math.min(r, h / 2, w / 2)));
        } else {
          const radius = Math.max(1, Math.min(r, h / 2, w / 2));
          this.ctx.moveTo(x + radius, y);
          this.ctx.arcTo(x + w, y, x + w, y + h, radius);
          this.ctx.arcTo(x + w, y + h, x, y + h, radius);
          this.ctx.arcTo(x, y + h, x, y, radius);
          this.ctx.arcTo(x, y, x + w, y, radius);
        }
        this.ctx.fill();
      }

      drawLids(eye) {
        const x = eye.x - eye.w / 2;
        const y = eye.y - eye.h / 2;
        if (eye.bottomLid > 0.01) {
          const cover = eye.h * eye.bottomLid;
          this.drawRoundedRect(x - 1, y + eye.h - cover, eye.w + 2, cover + 2, eye.r, this.bgColor);
        }
        if (eye.topLid <= 0.01) return;

        this.ctx.fillStyle = this.bgColor;
        this.ctx.beginPath();
        if (this.mood === 2) {
          const innerX = eye.x - eye.side * eye.w * 0.38;
          this.ctx.moveTo(x - 1, y - 1);
          this.ctx.lineTo(x + eye.w + 1, y - 1);
          this.ctx.lineTo(innerX, y + eye.h * eye.topLid);
        } else {
          this.ctx.moveTo(x - 1, y - 1);
          this.ctx.lineTo(x + eye.w + 1, y - 1);
          this.ctx.lineTo(x + eye.w + 1, y + eye.h * eye.topLid);
          this.ctx.lineTo(x - 1, y + eye.h * eye.topLid);
        }
        this.ctx.closePath();
        this.ctx.fill();
      }

      frame(now) {
        requestAnimationFrame((time) => this.frame(time));
        if (now - this.lastFrame < 33) return;
        this.lastFrame = now;
        this.updateTargets(now);

        const shake = !this.reduceMotion && now < this.confusedUntil ? (Math.floor(now / 60) % 2 ? 4 : -4) : 0;
        const laughing = now < this.laughUntil;
        const laughClosed = laughing && Math.floor(now / 80) % 2 === 0;
        const targetHeight = this.blinking || laughClosed ? 1 : this.defaultHeight;
        const targetTop = this.mood === 1 ? 0.5 : this.mood === 2 ? 0.45 : 0;
        const targetBottom = this.mood === 3 ? 0.48 : 0;
        const targetRadius = this.mood === 0 || this.mood === 3 ? this.defaultRadius : 4;
        const pupilX = Math.max(-5, Math.min(5, this.look.x * 0.65));
        const pupilY = Math.max(-3, Math.min(3, this.look.y * 0.45));

        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.eyes.forEach((eye) => {
          const baseX = this.canvas.width / 2 + eye.side * ((this.defaultWidth + this.space) / 2);
          eye.x = this.tween(eye.x, baseX + this.look.x + shake);
          eye.y = this.tween(eye.y, this.centerY + this.look.y);
          eye.w = this.tween(eye.w, this.defaultWidth);
          eye.h = this.tween(eye.h, targetHeight);
          eye.r = this.tween(eye.r, targetRadius);
          eye.topLid = this.tween(eye.topLid, targetTop);
          eye.bottomLid = this.tween(eye.bottomLid, targetBottom);
          eye.pupilX = this.tween(eye.pupilX, pupilX);
          eye.pupilY = this.tween(eye.pupilY, pupilY);

          this.drawRoundedRect(eye.x - eye.w / 2, eye.y - eye.h / 2, eye.w, eye.h, eye.r, this.eyeColor);
          if (eye.h > 8) {
            this.drawRoundedRect(eye.x + eye.pupilX - 3, eye.y + eye.pupilY - 5, 6, 10, 3, this.bgColor);
          }
          this.drawLids(eye);
        });
      }
    }

    /* One eyes instance per size. Canvases are reused across refreshes so blinking isn't reset every minute. */
    const eyeInstances = {};
    function eyesFor(size) {
      if (!eyeInstances[size]) {
        const canvas = document.createElement('canvas');
        canvas.width = 120;
        canvas.height = 48;
        canvas.className = 'eyes';
        canvas.setAttribute('aria-hidden', 'true');
        eyeInstances[size] = { canvas, eyes: new RoboEyes(canvas) };
      }
      return eyeInstances[size];
    }

    function renderAll(state) {
      const s = state.summary;
      const root = document.getElementById('root');
      root.innerHTML = SIZES.map((size) => {
        const title = SIZE ? '' : `<p class="preview-title">${size}</p>`;
        return `${title}<div class="${size}" data-size="${size}">${RENDERERS[size](s)}</div>`;
      }).join('');
      SIZES.forEach((size) => {
        const slot = root.querySelector(`[data-size="${size}"] .eyes-slot`);
        if (!slot) return;
        const instance = eyesFor(size);
        slot.appendChild(instance.canvas);
        instance.eyes.updateFromSummary(s);
      });
    }

    async function refresh() {
      try {
        const res = await fetch('/api/state', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        renderAll(await res.json());
      } catch (error) {
        document.getElementById('root').innerHTML = `<p class="state-msg">Couldn't load data (${error.message}).</p>`;
      }
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
