<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111312">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Food Widget">
  <link rel="manifest" href="widget.manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Food Tracker Widget</title>
  <style>
    :root{color-scheme:dark;--bg:#111312;--panel:#1a1f1c;--panel-2:#222720;--text:#f4f1e8;--muted:#aaa69a;--line:#343a33;--accent:#8fcf8f;--danger:#ff8c7a;--warn:#f4c86a}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;display:flex;flex-direction:column;gap:16px;align-items:center}
    .widget{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;width:100%;overflow:hidden}
    .label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:0}
    .big{font-size:44px;font-weight:700;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
    .positive{color:var(--accent)} .negative{color:var(--danger)}
    .muted{color:var(--muted)}
    .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
    .bar{height:8px;background:var(--panel-2);border-radius:999px;overflow:hidden;margin-top:6px}
    .fill{height:100%;background:var(--accent);border-radius:999px}
    .fill.warn{background:var(--warn)} .fill.danger{background:var(--danger)}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
    .stat strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}
    .macro{margin-top:10px}
    .macro .row span:last-child{font-size:12px}
    .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
    /* Size presets, mirroring common home-screen widget proportions */
    .small{width:170px;height:170px;aspect-ratio:1/1}
    .medium{width:360px;height:170px}
    .large{width:360px;min-height:380px}
    .small .widget,.medium .widget{height:100%;display:flex;flex-direction:column}
    .small .widget{justify-content:space-between;padding:14px}
    .preview-title{color:var(--muted);font-size:12px;margin:0 0 -8px;align-self:flex-start;width:100%;max-width:360px}
    .wrap{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
    .state-msg{color:var(--muted)}
    @media (max-width:420px){.medium,.large{width:100%}}
  </style>
</head>
<body>
  <div id="root" class="wrap"><p class="state-msg">Loading…</p></div>

  <script>
    const SIZE = new URLSearchParams(location.search).get('size');
    const SIZES = SIZE ? [SIZE] : ['small', 'medium', 'large'];
    const REFRESH_MS = 60_000;

    const fmt = (n, digits = 0) => Number.isFinite(Number(n)) ? Number(n).toLocaleString(undefined, { maximumFractionDigits: digits, minimumFractionDigits: digits }) : '-';
    const pctClass = (value, target) => {
      const pct = target > 0 ? (value / target) * 100 : 0;
      return pct > 115 ? 'danger' : pct > 90 ? 'warn' : '';
    };
    const barWidth = (value, target) => target > 0 ? Math.min(140, (value / target) * 100) : 0;

    function remainingBlock(s) {
      const cls = s.remaining_calories >= 0 ? 'positive' : 'negative';
      return `
        <p class="label">Remaining kcal</p>
        <div class="big ${cls}">${fmt(s.remaining_calories)}</div>
        <p class="muted">${fmt(s.totals.calories)} of ${fmt(s.targets.calories)} eaten</p>`;
    }

    function macroBars(s) {
      return [['Protein', 'protein'], ['Carbs', 'carbs'], ['Fat', 'fat']].map(([label, key]) => {
        const value = s.totals[key], target = s.targets[key];
        return `<div class="macro">
          <div class="row"><strong>${label}</strong><span class="muted">${fmt(value, 1)} / ${fmt(target, 1)}g</span></div>
          <div class="bar"><div class="fill ${pctClass(value, target)}" style="width:${barWidth(value, target)}%"></div></div>
        </div>`;
      }).join('');
    }

    function weightStats(w) {
      const trend = w.trend ? `${w.trend} ${w.trend === 'up' ? '↑' : w.trend === 'down' ? '↓' : '→'}` : 'no data';
      return `
        <div class="row"><p class="label">Weight</p><span class="tag">${trend}</span></div>
        <div class="stats">
          <div class="stat"><span class="muted">Current</span><strong>${w.latest ? fmt(w.latest.weight, 1) : '-'}</strong></div>
          <div class="stat"><span class="muted">7-day avg</span><strong>${w.average7 ? fmt(w.average7, 1) : '-'}</strong></div>
        </div>`;
    }

    const RENDERERS = {
      small: (s) => `
        <div class="widget">
          ${remainingBlock(s)}
          <p class="muted" style="margin:0">${s.weight.latest ? fmt(s.weight.latest.weight, 1) + ' kg' : 'No weight yet'}</p>
        </div>`,

      medium: (s) => `
        <div class="widget">
          <div class="row">
            <div>${remainingBlock(s)}</div>
            <div style="flex:1;min-width:0">${macroBars(s)}</div>
          </div>
        </div>`,

      large: (s) => `
        <div class="widget">
          ${remainingBlock(s)}
          <div style="margin-top:16px">${macroBars(s)}</div>
          <div style="margin-top:18px">${weightStats(s.weight)}</div>
        </div>`,
    };

    function renderAll(state) {
      const s = state.summary;
      document.getElementById('root').innerHTML = SIZES.map((size) => {
        const title = SIZE ? '' : `<p class="preview-title">${size}</p>`;
        return `${title}<div class="${size}">${RENDERERS[size](s)}</div>`;
      }).join('');
    }

    async function refresh() {
      try {
        const res = await fetch('/api/state', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        renderAll(await res.json());
      } catch (error) {
        document.getElementById('root').innerHTML = `<p class="state-msg">Couldn't load data (${error.message}).</p>`;
      }
    }

    refresh();
    setInterval(refresh, REFRESH_MS);
  </script>
</body>
</html>
