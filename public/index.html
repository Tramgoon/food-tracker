<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Tracker</title>
  <style>
    :root{color-scheme:dark;--bg:#111312;--panel:#1a1f1c;--panel-2:#222720;--text:#f4f1e8;--muted:#aaa69a;--line:#343a33;--accent:#8fcf8f;--danger:#ff8c7a;--warn:#f4c86a;--input:#0d0f0e}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45}
    button,input,select{font:inherit}
    button{border:1px solid var(--line);background:var(--panel-2);color:var(--text);border-radius:8px;padding:10px 12px;cursor:pointer}
    button:hover{border-color:var(--accent)}
    input,select{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}
    label{display:grid;gap:6px;color:var(--muted);font-size:13px}
    main{max-width:1180px;margin:0 auto;padding:22px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
    h1,h2,h3,p{margin:0}
    h1{font-size:28px}
    h2{font-size:20px;margin-bottom:14px}
    h3{font-size:16px}
    .muted{color:var(--muted)}
    .nav{display:flex;gap:8px;flex-wrap:wrap}
    .nav button{min-width:96px}
    .nav button.active{background:var(--accent);color:#102010;border-color:var(--accent)}
    .view{display:none}
    .view.active{display:block}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .grid.two{grid-template-columns:repeat(2,1fr)}
    .panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
    .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:stretch;margin-bottom:14px}
    .remaining{font-size:58px;font-weight:800;line-height:1}
    .positive{color:var(--accent)}
    .negative{color:var(--danger)}
    .metric{display:grid;gap:4px;min-height:96px}
    .metric strong{font-size:28px}
    .stack{display:grid;gap:14px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .actions button{padding:8px 10px;font-size:13px}
    .progress{height:12px;background:var(--input);border:1px solid var(--line);border-radius:999px;overflow:hidden;position:relative}
    .fill{height:100%;background:var(--accent);width:0}
    .fill.warn{background:var(--warn)}
    .fill.danger{background:var(--danger)}
    .form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
    .form-grid.six{grid-template-columns:repeat(6,1fr)}
    .span2{grid-column:span 2}
    .span4{grid-column:span 4}
    .meal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    .food-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
    .food-item:first-of-type{border-top:0}
    .grocery-item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
    .grocery-item:first-of-type{border-top:0}
    .suggestion-list{display:grid;gap:10px}
    .breakdown{display:flex;gap:8px;flex-wrap:wrap}
    .tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted);font-size:12px}
    .delete{color:var(--danger);min-width:42px}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
    th{color:var(--muted);font-weight:600}
    .bars{display:grid;grid-template-columns:repeat(14,1fr);gap:6px;align-items:end;height:170px;position:relative}
    .bar{background:var(--accent);border-radius:6px 6px 0 0;min-height:4px}
    .chart-wrap{height:220px;position:relative;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}
    .dot{position:absolute;width:9px;height:9px;background:var(--warn);border-radius:50%;transform:translate(-50%,50%)}
    .target-line{position:absolute;left:0;right:0;border-top:2px solid var(--danger);z-index:2;pointer-events:none}
    .target-line span{position:absolute;right:0;top:-22px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--danger);font-size:12px;white-space:nowrap}
    .toast{position:fixed;right:18px;bottom:18px;background:var(--panel-2);border:1px solid var(--line);padding:12px 14px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)}
    .spacer{height:14px}
    @media (max-width:820px){
      main{padding:16px}
      header,.hero{grid-template-columns:1fr;display:grid}
      .grid,.grid.two,.meal-grid,.form-grid,.form-grid.six{grid-template-columns:1fr}
      .span2,.span4{grid-column:auto}
      .remaining{font-size:44px}
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Food Tracker</h1>
        <p class="muted" id="todayLabel"></p>
      </div>
      <nav class="nav" id="nav"></nav>
    </header>

    <section id="dashboard" class="view active">
      <div class="hero">
        <div class="panel">
          <p class="muted">Remaining calories today</p>
          <div id="remaining" class="remaining positive">0</div>
          <p class="muted" id="remainingDetail"></p>
        </div>
        <div class="panel stack" id="weightSummary"></div>
      </div>
      <div class="grid" id="metricCards"></div>
      <div class="spacer"></div>
      <div class="panel">
        <h2>Macros</h2>
        <div class="stack" id="macroBars"></div>
      </div>
      <div class="spacer"></div>
      <div class="panel">
        <h2>Targets</h2>
        <form id="configForm" class="form-grid six"></form>
        <div class="spacer"></div>
        <div class="actions">
          <button type="button" id="exportJson">Export JSON</button>
          <button type="button" id="exportCsv">Export CSV</button>
        </div>
      </div>
    </section>

    <section id="food" class="view">
      <div class="grid two">
        <div class="panel">
          <h2>Add Food</h2>
          <form id="foodForm" class="form-grid">
            <label class="span4">Description<input name="description" required></label>
            <label>Calories<input name="calories" type="number" min="0" step="0.1" required></label>
            <label>Protein<input name="protein" type="number" min="0" step="0.1"></label>
            <label>Carbs<input name="carbs" type="number" min="0" step="0.1"></label>
            <label>Fat<input name="fat" type="number" min="0" step="0.1"></label>
            <label class="span2">Meal<select name="meal_type"><option>breakfast</option><option>lunch</option><option>dinner</option><option>snack</option></select></label>
            <label>Date<input name="date" type="date"></label>
            <button type="submit">Add food</button>
          </form>
        </div>
        <div class="panel">
          <h2>Quick Add</h2>
          <form id="quickForm" class="form-grid">
            <label class="span2">Description<input name="description" required></label>
            <label>Calories<input name="calories" type="number" min="0" step="0.1" required></label>
            <label>Date<input name="date" type="date"></label>
            <button type="submit">Add</button>
          </form>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="meal-grid" id="mealGroups"></div>
    </section>

    <section id="weight" class="view">
      <div class="grid two">
        <div class="panel">
          <h2>Log Weight</h2>
          <form id="weightForm" class="form-grid">
            <label class="span2">Weight<input name="weight" type="number" min="1" step="0.1" required></label>
            <label>Date<input name="date" type="date" required></label>
            <button type="submit">Save</button>
          </form>
        </div>
        <div class="panel stack" id="weightStats"></div>
      </div>
      <div class="spacer"></div>
      <div class="panel">
        <h2>History</h2>
        <table><thead><tr><th>Date</th><th>Weight</th><th>Change</th></tr></thead><tbody id="weightRows"></tbody></table>
      </div>
    </section>

    <section id="groceries" class="view">
      <div class="hero">
        <div class="panel">
          <p class="muted">Spent this month</p>
          <div id="groceryMonthTotal" class="remaining positive">£0</div>
          <p class="muted" id="groceryMonthDetail"></p>
        </div>
        <div class="panel">
          <h2>Quick Add</h2>
          <form id="groceryQuickForm" class="form-grid">
            <label class="span2">Name<input name="name" required></label>
            <label>Price<input name="price" type="number" min="0" step="0.01"></label>
            <button type="submit">Add</button>
          </form>
        </div>
      </div>
      <div class="panel">
        <h2>Add Grocery</h2>
        <form id="groceryForm" class="form-grid six">
          <label class="span2">Name<input name="name" required></label>
          <label>Quantity<input name="quantity" value="1"></label>
          <label>Category<select name="category" id="groceryCategory"></select></label>
          <label>Price<input name="price" type="number" min="0" step="0.01"></label>
          <label>Date<input name="date" type="date" required></label>
          <button type="submit">Add grocery</button>
        </form>
      </div>
      <div class="spacer"></div>
      <div class="meal-grid" id="groceryGroups"></div>
      <div class="spacer"></div>
      <div class="panel">
        <h2>Suggestions for next trip</h2>
        <div class="grid two" id="grocerySuggestions"></div>
      </div>
    </section>

    <section id="insights" class="view">
      <div class="grid two">
        <div class="panel">
          <h2>Daily Calories</h2>
          <div class="bars" id="calorieChart"></div>
        </div>
        <div class="panel">
          <h2>Weight Trend</h2>
          <div class="chart-wrap" id="weightChart"></div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="grid" id="insightStats"></div>
      <div class="spacer"></div>
      <div class="panel"><h2>Insight</h2><p id="insightText"></p></div>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const tabs = [
      ['dashboard', 'Dashboard'],
      ['food', 'Food Log'],
      ['weight', 'Weight'],
      ['groceries', 'Groceries'],
      ['insights', 'Insights']
    ];
    const groceryCategories = ['produce', 'meat', 'dairy', 'pantry', 'frozen', 'snacks', 'drinks', 'household', 'other'];
    let state = null;

    const $ = (id) => document.getElementById(id);
    const fmt = (n, digits = 0) => Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: digits });
    const money = (n) => Number(n || 0).toLocaleString(undefined, { style: 'currency', currency: 'GBP' });
    const today = () => new Date().toISOString().slice(0, 10);

    function toast(message) {
      const el = $('toast');
      el.textContent = message;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1800);
    }

    async function api(url, options = {}) {
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function renderNav() {
      $('nav').innerHTML = tabs.map(([id, label]) => `<button data-tab="${id}" class="${id === 'dashboard' ? 'active' : ''}">${label}</button>`).join('');
      $('nav').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-tab]');
        if (!button) return;
        document.querySelectorAll('.view').forEach((view) => view.classList.remove('active'));
        document.querySelectorAll('.nav button').forEach((nav) => nav.classList.remove('active'));
        $(button.dataset.tab).classList.add('active');
        button.classList.add('active');
      });
    }

    function renderDashboard() {
      const s = state.summary;
      $('todayLabel').textContent = s.date;
      $('remaining').textContent = fmt(s.remaining_calories);
      $('remaining').className = `remaining ${s.remaining_calories >= 0 ? 'positive' : 'negative'}`;
      $('remainingDetail').textContent = `${fmt(s.totals.calories)} consumed of ${fmt(s.targets.calories)} target`;

      const metrics = [
        ['Calories consumed', s.totals.calories, 'kcal'],
        ['Protein', s.totals.protein, 'g'],
        ['Carbs', s.totals.carbs, 'g'],
        ['Fat', s.totals.fat, 'g']
      ];
      $('metricCards').innerHTML = metrics.map(([label, value, unit]) => `<div class="card metric"><span class="muted">${label}</span><strong>${fmt(value, 1)}</strong><span>${unit}</span></div>`).join('');

      $('macroBars').innerHTML = [
        ['Protein', s.totals.protein, s.targets.protein],
        ['Carbs', s.totals.carbs, s.targets.carbs],
        ['Fat', s.totals.fat, s.targets.fat]
      ].map(([label, value, target]) => {
        const pct = target > 0 ? Math.min(140, (value / target) * 100) : 0;
        const cls = pct > 115 ? 'danger' : pct > 90 ? 'warn' : '';
        return `<div><div class="row"><strong>${label}</strong><span class="muted">${fmt(value, 1)} / ${fmt(target, 1)}g</span></div><div class="progress"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`;
      }).join('');

      renderWeightBlocks();
      renderConfigForm();
    }

    function renderWeightBlocks() {
      const w = state.summary.weight;
      const arrow = w.trend === 'up' ? '↑' : w.trend === 'down' ? '↓' : '→';
      const html = `
        <div class="row"><h2>Weight</h2><span class="tag">${w.trend || 'no data'} ${w.trend ? arrow : ''}</span></div>
        <div class="grid two">
          <div><p class="muted">Current</p><h3>${w.latest ? fmt(w.latest.weight, 1) : '-'}</h3></div>
          <div><p class="muted">7-day avg</p><h3>${w.average7 ? fmt(w.average7, 1) : '-'}</h3></div>
          <div><p class="muted">Target</p><h3>${w.target ? fmt(w.target, 1) : '-'}</h3></div>
          <div><p class="muted">Predicted</p><h3>${w.predicted_date || '-'}</h3></div>
        </div>
        <p class="muted">${w.prediction_note || ''}</p>`;
      $('weightSummary').innerHTML = html;
      $('weightStats').innerHTML = html;
    }

    function renderConfigForm() {
      const c = state.config;
      const fields = [
        ['calorie_target', 'Calories', 'number'],
        ['protein_target', 'Protein', 'number'],
        ['carb_target', 'Carbs', 'number'],
        ['fat_target', 'Fat', 'number'],
        ['starting_weight', 'Starting weight', 'number'],
        ['target_weight', 'Target weight', 'number']
      ];
      $('configForm').innerHTML = fields.map(([key, label, type]) => `<label>${label}<input name="${key}" type="${type}" min="0" step="0.1" value="${c[key] || ''}"></label>`).join('') +
        `<label>Activity<select name="activity_level"><option value="sedentary">sedentary</option><option value="light">light</option><option value="moderate">moderate</option><option value="active">active</option></select></label><button type="submit">Save targets</button>`;
      $('configForm').activity_level.value = c.activity_level || 'sedentary';
    }

    function renderFood() {
      const groups = state.summary.foods_by_meal;
      $('mealGroups').innerHTML = ['breakfast', 'lunch', 'dinner', 'snack'].map((meal) => `
        <div class="panel">
          <div class="row"><h2>${meal[0].toUpperCase() + meal.slice(1)}</h2><span class="tag">${groups[meal].length}</span></div>
          ${groups[meal].map((food) => `
            <div class="food-item">
              <div>
                <strong>${escapeHtml(food.description)}</strong>
                <p class="muted">${fmt(food.calories, 1)} kcal · P ${fmt(food.protein, 1)} · C ${fmt(food.carbs, 1)} · F ${fmt(food.fat, 1)} <span class="tag">${food.source}</span></p>
              </div>
              <button class="delete" data-delete="${food.id}" title="Delete">x</button>
            </div>
          `).join('') || '<p class="muted">No entries.</p>'}
        </div>
      `).join('');
    }

    function renderWeight() {
      const rows = state.weight_history;
      $('weightRows').innerHTML = rows.map((row, i) => {
        const next = rows[i + 1];
        const change = next ? row.weight - next.weight : 0;
        return `<tr><td>${row.date}</td><td>${fmt(row.weight, 1)}</td><td class="${change > 0 ? 'negative' : change < 0 ? 'positive' : ''}">${next ? `${change > 0 ? '+' : ''}${fmt(change, 1)}` : '-'}</td></tr>`;
      }).join('') || '<tr><td colspan="3" class="muted">No weights logged.</td></tr>';
    }

    function renderGroceries() {
      const groceries = state.groceries || [];
      const month = today().slice(0, 7);
      const monthItems = groceries.filter((item) => item.date.startsWith(month));
      const monthTotal = monthItems.reduce((sum, item) => sum + Number(item.price || 0), 0);
      $('groceryMonthTotal').textContent = money(monthTotal);
      $('groceryMonthDetail').textContent = `${monthItems.length} item${monthItems.length === 1 ? '' : 's'} logged in ${month}`;

      const categories = [...new Set([...groceryCategories, ...groceries.map((item) => item.category)])];
      $('groceryGroups').innerHTML = categories.map((category) => {
        const items = groceries.filter((item) => item.category === category);
        if (!items.length) return '';
        const total = items.reduce((sum, item) => sum + Number(item.price || 0), 0);
        return `
          <div class="panel">
            <div class="row"><h2>${escapeHtml(titleCase(category))}</h2><span class="tag">${items.length} · ${money(total)}</span></div>
            ${items.map((item) => `
              <div class="grocery-item">
                <div>
                  <strong>${escapeHtml(item.name)}</strong>
                  <p class="muted">${escapeHtml(item.quantity)} · ${money(item.price)} · ${item.date} <span class="tag">${escapeHtml(item.source)}</span></p>
                </div>
                <button class="delete" data-grocery-delete="${item.id}" title="Delete">x</button>
              </div>
            `).join('')}
          </div>`;
      }).join('') || '<div class="panel"><p class="muted">No groceries logged yet.</p></div>';

      renderGrocerySuggestions();
    }

    function renderGrocerySuggestions() {
      const suggestions = state.grocery_suggestions || {};
      const regular = suggestions.regular_items || [];
      const runningLow = suggestions.running_low || [];
      const staleCategories = suggestions.stale_categories || [];
      const spending = suggestions.category_spending || {};
      const spendingRows = Object.entries(spending).sort((a, b) => b[1] - a[1]);

      $('grocerySuggestions').innerHTML = [
        `<div class="card">
          <div class="row"><h3>Buy Again</h3><span class="tag">${regular.length}</span></div>
          <div class="spacer"></div>
          <div class="suggestion-list">${regular.map((item) => `<p><strong>${escapeHtml(item.name)}</strong> <span class="tag">buy again</span><br><span class="muted">${item.count} purchases, last on ${item.last_purchased}</span></p>`).join('') || '<p class="muted">No regular items yet.</p>'}</div>
        </div>`,
        `<div class="card">
          <div class="row"><h3>Running Low</h3><span class="tag">${runningLow.length}</span></div>
          <div class="spacer"></div>
          <div class="suggestion-list">${runningLow.map((item) => `<p><strong>${escapeHtml(item.name)}</strong><br><span class="muted">${item.days_since} days since last purchase</span></p>`).join('') || '<p class="muted">Nothing looks overdue.</p>'}</div>
        </div>`,
        `<div class="card">
          <div class="row"><h3>Quiet Categories</h3><span class="tag">${staleCategories.length}</span></div>
          <div class="spacer"></div>
          <div class="breakdown">${staleCategories.map((category) => `<span class="tag">${escapeHtml(titleCase(category))}</span>`).join('') || '<p class="muted">All categories have recent activity.</p>'}</div>
        </div>`,
        `<div class="card">
          <div class="row"><h3>Last 30 Days</h3><span class="tag">${spendingRows.length}</span></div>
          <div class="spacer"></div>
          <div class="suggestion-list">${spendingRows.map(([category, total]) => `<p><strong>${escapeHtml(titleCase(category))}</strong><br><span class="muted">${money(total)}</span></p>`).join('') || '<p class="muted">No category spending yet.</p>'}</div>
        </div>`
      ].join('');
    }

    function renderInsights() {
      const insights = state.summary.insights;
      const calorieTarget = Number(state.summary.targets.calories || 0);
      const maxCalories = Math.max(1, calorieTarget, ...insights.calorie_chart.map((row) => row.calories));
      const calorieBars = insights.calorie_chart.map((row) => `<div class="bar" title="${row.date}: ${fmt(row.calories)} kcal" style="height:${Math.max(3, row.calories / maxCalories * 100)}%"></div>`).join('');
      const calorieTargetLine = calorieTarget > 0
        ? `<div class="target-line" style="bottom:${Math.min(100, calorieTarget / maxCalories * 100)}%"><span>${fmt(calorieTarget)} kcal</span></div>`
        : '';
      $('calorieChart').innerHTML = (calorieBars || '<p class="muted">No calorie data.</p>') + calorieTargetLine;

      const weights = insights.weight_chart;
      const weightTarget = Number(state.summary.weight.target || 0);
      const weightValues = weights.map((row) => row.weight).concat(weightTarget > 0 ? [weightTarget] : []);
      const min = Math.min(...weightValues);
      const max = Math.max(...weightValues);
      const weightDots = weights.map((row, i) => {
        const x = weights.length > 1 ? (i / (weights.length - 1)) * 100 : 50;
        const y = max === min ? 50 : 100 - ((row.weight - min) / (max - min)) * 90 - 5;
        return `<span class="dot" title="${row.date}: ${fmt(row.weight, 1)}" style="left:${x}%;bottom:${100 - y}%"></span>`;
      }).join('');
      const targetBottom = max === min ? 50 : ((weightTarget - min) / (max - min)) * 90 + 5;
      const weightTargetLine = weightTarget > 0
        ? `<div class="target-line" style="bottom:${targetBottom}%"><span>${fmt(weightTarget, 1)}</span></div>`
        : '';
      $('weightChart').innerHTML = (weightDots || '<p class="muted">No weight data.</p>') + weightTargetLine;

      const stats = insights.stats;
      $('insightStats').innerHTML = [
        ['Avg calories 7d', stats.average_calories_7d],
        ['Avg calories 30d', stats.average_calories_30d],
        ['Days logged', stats.days_logged],
        ['Current streak', stats.current_streak]
      ].map(([label, value]) => `<div class="card metric"><span class="muted">${label}</span><strong>${fmt(value)}</strong></div>`).join('');
      $('insightText').textContent = insights.text;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    }

    function titleCase(value) {
      return String(value || '').replace(/_/g, ' ').replace(/\b\w/g, (char) => char.toUpperCase());
    }

    function render() {
      renderDashboard();
      renderFood();
      renderWeight();
      renderGroceries();
      renderInsights();
      $('weightForm').date.value = $('weightForm').date.value || today();
      $('foodForm').date.value = $('foodForm').date.value || today();
      $('quickForm').date.value = $('quickForm').date.value || today();
      $('groceryForm').date.value = $('groceryForm').date.value || today();
      $('groceryForm').quantity.value = $('groceryForm').quantity.value || '1';
    }

    async function load() {
      state = await api('/api/state');
      render();
    }

    function formData(form) {
      return Object.fromEntries(new FormData(form).entries());
    }

    function downloadExport(url) {
      window.location.href = url;
    }

    renderNav();
    $('groceryCategory').innerHTML = groceryCategories.map((category) => `<option value="${category}">${titleCase(category)}</option>`).join('');
    load().catch((error) => toast(error.message));

    $('exportJson').addEventListener('click', () => downloadExport('/api/export'));
    $('exportCsv').addEventListener('click', () => downloadExport('/api/export.csv'));

    $('foodForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = formData(event.target);
      const res = await api('/api/food-web', { method: 'POST', body: JSON.stringify(data) });
      state = res.state;
      event.target.reset();
      render();
      toast('Food added');
    });

    $('quickForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = { ...formData(event.target), meal_type: 'snack', protein: 0, carbs: 0, fat: 0 };
      const res = await api('/api/food-web', { method: 'POST', body: JSON.stringify(data) });
      state = res.state;
      event.target.reset();
      render();
      toast('Quick add saved');
    });

    $('mealGroups').addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-delete]');
      if (!button) return;
      if (!confirm('Delete this food entry?')) return;
      const res = await api(`/api/food-web/${button.dataset.delete}`, { method: 'DELETE' });
      state = res.state;
      render();
      toast('Food deleted');
    });

    $('weightForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const res = await api('/api/weight-web', { method: 'POST', body: JSON.stringify(formData(event.target)) });
      state = res.state;
      render();
      toast('Weight saved');
    });

    $('groceryForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const res = await api('/api/groceries-web', { method: 'POST', body: JSON.stringify(formData(event.target)) });
      state = res.state;
      event.target.reset();
      render();
      toast('Grocery added');
    });

    $('groceryQuickForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const res = await api('/api/groceries-web', { method: 'POST', body: JSON.stringify(formData(event.target)) });
      state = res.state;
      event.target.reset();
      render();
      toast('Quick grocery saved');
    });

    $('groceryGroups').addEventListener('click', async (event) => {
      const button = event.target.closest('button[data-grocery-delete]');
      if (!button) return;
      if (!confirm('Delete this grocery item?')) return;
      const res = await api(`/api/groceries-web/${button.dataset.groceryDelete}`, { method: 'DELETE' });
      state = res.state;
      render();
      toast('Grocery deleted');
    });

    $('configForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = formData(event.target);
      for (const [key, value] of Object.entries(data)) {
        await api('/api/config', { method: 'POST', body: JSON.stringify({ key, value }) });
      }
      await load();
      toast('Targets saved');
    });
  </script>
</body>
</html>
